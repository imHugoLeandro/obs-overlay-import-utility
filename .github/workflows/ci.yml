name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . "ruff==0.15.22"
      - name: Install Xvfb and Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
      - name: Run tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          export PYTHONFAULTHANDLER=1
          xvfb-run -a python -m unittest discover -s tests -v 2>&1 \
            | tee test-results.txt
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONFAULTHANDLER = "1"
          python -m unittest discover -s tests -v 2>&1 |
            Tee-Object -FilePath test-results.txt
          $testExitCode = $LASTEXITCODE
          exit $testExitCode
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.txt
          if-no-files-found: warn
          retention-days: 14
      - run: python -m compileall -q src tests
      - run: python -m ruff check .
        if: matrix.os == 'ubuntu-latest'
      - name: AST/import check
        run: |
          python -c "import ast; from pathlib import Path; paths = list(Path('src').rglob('*.py')); paths += list(Path('tests').rglob('*.py')); [ast.parse(p.read_text(encoding='utf-8')) for p in paths]; print(f'AST OK: {len(paths)} files')"
