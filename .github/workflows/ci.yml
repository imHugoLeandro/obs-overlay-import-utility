name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m ruff check .
        if: matrix.os == 'ubuntu-latest'
      - name: Tk smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          xvfb-run python -m unittest tests.test_exporter -v
      - name: AST/import check
        run: |
          python -c "import ast; from pathlib import Path; paths = list(Path('src').rglob('*.py')); paths += list(Path('tests').rglob('*.py')); [ast.parse(p.read_text(encoding='utf-8')) for p in paths]; print(f'AST OK: {len(paths)} files')"
