name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . -r requirements-dev.txt
      - name: Install Xvfb and Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
      - name: Run tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          export PYTHONFAULTHANDER=1
          xvfb-run -a python -m unittest discover -s tests -v 2>&1 \
            | tee test-results.txt
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONFAULTHANDER = "1"
          python -m unittest discover -s tests -v 2>&1 |
            Tee-Object -FilePath test-results.txt
          $testExitCode = $LASTEXITCODE
          exit $testExitCode
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.txt
          if-no-files-found: warn
          retention-days: 14
      - run: python -m compileall -q src tests
      - run: python -m ruff check .
        if: matrix.os == 'ubuntu-latest'
      - name: AST/import check
        run: |
          python -c "import ast; from pathlib import Path; paths = list(Path('src').rglob('*.py')); paths += list(Path('tests').rglob('*.py')); [ast.parse(p.read_text(encoding='utf-8')) for p in paths]; print(f'AST OK: {len(paths)} files')"

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python package
        run: |
          python -m pip install -e .
      - name: Install Electron dependencies
        run: |
          cd desktop
          npm ci
      - name: TypeScript type checking
        run: |
          cd desktop
          npm run typecheck
      - name: Run Electron tests
        run: |
          cd desktop
          npm test
      - name: Run ESLint
        run: |
          cd desktop
          npm run lint
      - name: Build Electron artifacts
        run: |
          cd desktop
          npm run build
      - name: Verify compiled output
        run: |
          cd desktop
          test -f dist-electron/main/index.js
          test -f dist-electron/preload/index.js
          test -f dist/index.html
      - name: Verify no process.execPath as Python
        run: |
          cd desktop
          ! grep -q 'process\.execPath' dist-electron/main/index.js
