[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obs-overlay-import-utility"
version = "2.0.0"
description = "Portable utility that relinks local assets in OBS scene collections."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "OBS Overlay Import Utility contributors" }]
keywords = ["OBS", "overlay", "scene collection", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
]
dependencies = ["svg.path>=6.0,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7"]

[project.gui-scripts]
obs-overlay-import-utility = "obs_overlay_import_utility.ui:main"

[project.urls]
Homepage = "https://github.com/imhugoleandro/obs-overlay-import-utility"
Issues = "https://github.com/imhugoleandro/obs-overlay-import-utility/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obs_overlay_import_utility = ["assets/*.png", "assets/*.svg", "assets/*.ttf"]
